<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぬいよ、逃げろ。</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="startScreen" class="screen">

    <div class="title">
      <div class="tiny">NUI ESCAPE</div>
      <h1>ぬいよ、逃げろ。</h1>
      <p>ダニから逃げろ！</p>
    </div>

    <div class="card">

      <label class="photoButton">
        <span id="photoText">📷 ぬいの写真を選ぶ</span>
        <input
          id="imageInput"
          type="file"
          accept="image/*"
        >
      </label>

      <div id="previewBox">
        <img id="preview" alt="ぬいの写真">
      </div>

      <input
        id="nameInput"
        type="text"
        maxlength="20"
        placeholder="ぬいの名前（なくてもOK）"
      >

      <div class="guide">

        <div class="guideTitle">
          ゲーム中に拾えるもの
        </div>

        <div class="guideRow">
          <span>🧹</span>

          <div>
            <b>掃除機</b>
            <small>
              画面内のダニが全部いなくなる
            </small>
          </div>
        </div>

        <div class="guideRow">
          <span>🧴</span>

          <div>
            <b>スプレー</b>
            <small>
              5秒間、ダニに当たっても平気
            </small>
          </div>
        </div>

        <div class="guideRow">
          <span>🍪</span>

          <div>
            <b>おやつ</b>
            <small>
              5秒間、ぬいの動きが少し速くなる
            </small>
          </div>
        </div>

      </div>

      <button id="startButton">
        ゲームをはじめる
      </button>

      <div class="hint">
        写真を選んでからスタートしてね
      </div>

    </div>

  </div>


  <div id="gameScreen">

    <canvas id="gameCanvas"></canvas>

    <div class="hud">

      <div>
        <span>TIME</span>
        <strong id="timeText">0.0</strong>
      </div>

      <div>
        <span>LIFE</span>
        <strong id="lifeText">♥♥♥</strong>
      </div>

      <div>
        <span>BEST</span>
        <strong id="bestText">0.0</strong>
      </div>

    </div>


    <div id="levelText">
      LEVEL 1
    </div>


    <div id="notice"></div>


    <div id="resultScreen">

      <div class="resultCard">

        <img
          id="resultImage"
          class="resultImage"
          alt="ぬいの写真"
        >

        <div class="resultTiny">
          TODAY'S RESULT
        </div>

        <h2 id="resultTitle">
          よく頑張った。
        </h2>


        <div class="survival">

          <span>生存時間</span>

          <strong id="finalTime">
            0.0秒
          </strong>

        </div>


        <div class="numbers">

          <div>
            <span>遭遇したダニ</span>
            <b id="miteCount">
              0匹
            </b>
          </div>

          <div>
            <span>拾ったもの</span>
            <b id="itemCount">
              0個
            </b>
          </div>

          <div>
            <span>おやつ</span>
            <b id="snackCount">
              0個
            </b>
          </div>

        </div>


        <div class="ratings">

          <div>
            <span>逃げ足</span>
            <b id="speedRating">
              ★★★★★
            </b>
          </div>

          <div>
            <span>警戒心</span>
            <b id="alertRating">
              ★★★★★
            </b>
          </div>

          <div>
            <span>かわいさ</span>
            <b>
              ★★★★★
            </b>
          </div>

        </div>


        <div class="commentBox">

          <div>
            今日のひとこと
          </div>

          <p id="commentText"></p>

        </div>


        <button id="retryButton">
          もう一度やる
        </button>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
